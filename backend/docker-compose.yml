services:
    laravel.test:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: volunteer_backend
        restart: unless-stopped
        volumes:
            - .:/var/www/html
        ports:
            - "8000:8000"
        depends_on:
            - pgsql
        networks:
            - sail
        command: php artisan serve --host=0.0.0.0 --port=8000

    pgsql:
        image: 'postgres:17'
        container_name: volunteer_pgsql
        restart: unless-stopped
        ports:
            - '5433:5432'
        environment:
            POSTGRES_DB: '${DB_DATABASE:-laravel}'
            POSTGRES_USER: '${DB_USERNAME:-sail}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - sail-pgsql:/var/lib/postgresql/data
        networks:
            - sail

networks:
    sail:
        driver: bridge

volumes:
    sail-pgsql:
        driver: local