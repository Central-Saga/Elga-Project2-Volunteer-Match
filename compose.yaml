services:
  pgsql:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: sail
      POSTGRES_PASSWORD: secret
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sail -d laravel"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: "5432"
      DB_DATABASE: laravel
      DB_USERNAME: sail
      DB_PASSWORD: secret
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    depends_on:
      pgsql:
        condition: service_healthy
    command:
      - sh
      - -lc
      - |
        set -e
        composer install --no-interaction --prefer-dist --no-progress
        if [ ! -f .env ]; then cp .env.example .env; fi
        if ! grep -Eq '^APP_KEY=.+$' .env; then
          php artisan key:generate --force
        fi
        php artisan migrate --force
        exec php artisan serve --host=0.0.0.0 --port=8000

  frontend:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next
    depends_on:
      - backend
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then((response) => process.exit(response.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    command:
      - sh
      - -lc
      - |
        set -e
        npm ci
        exec npm run dev -- --hostname 0.0.0.0

volumes:
  postgres-data:
  backend-vendor:
  frontend-node-modules:
  frontend-next:
